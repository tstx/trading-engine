name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [debug, asan-ubsan, tsan]
        include:
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
          - compiler: clang
            cc: clang-18
            cxx: clang++-18
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      # Ubuntu-24.04-Runner nutzen vm.mmap_rnd_bits=32; ältere ASan/TSan-Laufzeiten
      # brechen dann mit "unexpected memory mapping" ab.
      - name: Reduce ASLR entropy for sanitizers
        if: matrix.preset != 'debug'
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format-18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18

      - name: Check formatting
        run: |
          clang-format-18 --version
          find include src tests -type f \( -name '*.hpp' -o -name '*.cpp' \) -print0 \
            | xargs -0 clang-format-18 --dry-run --Werror

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    # Vorerst nur informativ; wird scharf geschaltet, sobald Stufe 1 sauber ist.
    continue-on-error: true
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang-tidy-18

      # Configure erzeugt build/debug/compile_commands.json (CMAKE_EXPORT_COMPILE_COMMANDS=ON).
      - name: Configure
        run: cmake --preset debug

      - name: Run clang-tidy
        run: |
          clang-tidy-18 --version
          run-clang-tidy-18 -p build/debug -quiet -clang-tidy-binary clang-tidy-18 \
            "${GITHUB_WORKSPACE}/(src|tests|bench)/.*\.cpp$"
